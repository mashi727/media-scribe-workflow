# /etc/wsl.conf （WSL 側。変更後は Windows で `wsl --shutdown`）
[boot]
systemd=true

# --- Windows 側 %UserProfile%\.wslconfig（参考） ---
# [wsl2]
# memory=24GB
# vmIdleTimeout=-1          # アイドルで VM を止めない
#
# --- Windows のタスクスケジューラ（ログオン時 / 起動時） ---
# 操作: wsl.exe -d Ubuntu --exec /bin/true
#   → WSL が起動し、systemd が msw-api / msw-worker / cloudflared を立ち上げる
# 電源設定: 処理中にスリープしないよう「スリープ: なし」推奨
