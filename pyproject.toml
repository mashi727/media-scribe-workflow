[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-scribe-workflow"
version = "2.1.34"
description = "メディアから字幕・チャプター・LaTeX レポート PDF を生成する CLI ツール群とレポートパイプライン"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "mashi727"}
]
keywords = ["media", "video", "subtitle", "srt", "whisper", "latex", "report", "cli", "pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

dependencies = [
    "PyYAML>=6.0",
    "yt-dlp>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/mashi727/media-scribe-workflow"
Repository = "https://github.com/mashi727/media-scribe-workflow"
"GUI (Chaptr)" = "https://github.com/mashi727/chaptr"

# CLI コマンドは bin/ ディレクトリのスクリプトで提供（pip 経由でなく PATH 経由を想定）
# 必要な場合は将来 [project.scripts] にエントリポイントを追加

[tool.hatch.build.targets.wheel]
packages = ["media_scribe_workflow"]
