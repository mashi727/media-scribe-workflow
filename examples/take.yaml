# ============================================================
# take.yaml — rehearsal-sync 用 per-take 設定（全キー・リファレンス）
# ============================================================
# 一次ファイル（カメラ映像 + 別録り L/R 音声）から、同期・差し替え済み
# 映像を 1 コマンドで生成するための宣言的設定。
#
#   rehearsal-sync take.yaml
#   rehearsal-sync take.yaml --dry-run     # 実行される配管コマンドを列挙するだけ
#   rehearsal-sync take.yaml --keep-work   # 中間生成物を残す（既定は完了時に削除）
#   rehearsal-sync take.yaml -v            # 実行コマンドを逐次表示
#   rehearsal-sync take.yaml --force       # 検証に失敗しても中断せず続行
#
# 必須キーは video / audio / output.path の 3 つだけ。残りは既定値がある。
# パスはすべて「この YAML があるフォルダ」基準の相対（glob 可、大小拡張子両対応。
# *.wav は .WAV に、*.mp4 は .MP4 にもマッチ）。どこに置いても・どこから実行しても動く。
# ============================================================

version: 1                  # スキーマ版（現状は読み取り専用。将来の互換判定用）

# ------------------------------------------------------------
# video（必須）— カメラ映像
# ------------------------------------------------------------
# glob 可。複数マッチは名前順で 1 本に連結（video-concat、-c:v copy 無劣化）。
# 連結には全セグメントが同一パラメータ（codec/解像度/pix_fmt/fps/time_base）である必要。
# 重要: 「1 本の連続タイムライン」を成すこと。カメラの自動分割セグメント（ギャップ
#       なし）は OK。間を空けて撮った別クリップを並べると先頭以外に別の音声が乗るため、
#       テイクを分けて take.yaml を別々にする（sync.verify がこの不整合を検出し中断）。
video:
  - "insta360/VID_*.mp4"    # サブフォルダ可。take 直下なら "VID_*.mp4"
  # - "VID_*.mp4"           # 複数パターンも可（各々を名前順連結）
  # 例: Insta360 の .lrv プロキシは *.mp4 に非マッチなので自動除外される

# ------------------------------------------------------------
# audio（必須）— 別録り音声。2 つの与え方のどちらか
# ------------------------------------------------------------
audio:
  # (A) L/R 別ソース（推奨・高精度）— 各chを映像へ個別同期してから結合。
  #     TX1/TX2 は独立レコーダー（開始時刻・クロックが別）でも共通の映像クロックに
  #     固定されるため、左右の独立開始・相互ドリフトを自動吸収する。
  left:  [ L/*.wav ]        # → ステレオ左（例: 指揮者マイク TX1）。glob 可、名前順連結
  right: [ R/*.wav ]        # → ステレオ右（TX2）

  # (B) 相互整合済みステレオ 1 本（left/right の代わりに指定）。
  #     rehearsal-finalize-audio --stereo で作った stereo.wav など。1 本として映像へ同期。
  # stereo: [ stereo.wav ]

# ------------------------------------------------------------
# normalize（任意）— 各チャンネル個別に適用。既定 method: loudnorm
# ------------------------------------------------------------
normalize:
  method: loudnorm          # loudnorm | peak | none
                            #   loudnorm = EBU R128（指示が聞こえる、振り返り用）
                            #   peak     = ピーク正規化（演奏品質保持）
                            #   none     = 正規化しない（仕上げ済み音源を渡すとき）
  I:   -14                  # loudnorm: 目標 integrated loudness (LUFS)
  TP:  -1.5                 # loudnorm: true peak ceiling (dBTP)
  LRA: 11                   # loudnorm: 目標 loudness range (LU)
  bit_depth: "24"           # 出力ビット深度 16 | 24 | 32f（loudnorm/peak 時）

# ------------------------------------------------------------
# drift（任意）— クロックドリフト補正。既定 enabled: false
# ------------------------------------------------------------
# 長時間テイクは映像と音声のサンプルクロック差（機材実測で概ね 9〜17ppm）が末尾で
# 無視できないズレになる（15ppm×3h ≈ 0.16s）。目安: 1 時間超で有効化を推奨。
# 迷えば有効化してよい（|ppm| が小さければ audio-drift-correct が自動で素通しコピー）。
drift:
  enabled: true             # true で各chを個別にドリフト補正
  window: 120               # 冒頭/終端の測定窓（秒）。長尺は広げると lever が伸び精度向上

# ------------------------------------------------------------
# sync（任意）— 同期検出と検証
# ------------------------------------------------------------
sync:
  rate: 8000                # 同期検出のサンプルレート（相関用に音声をこの Hz へ落とす）
  min_score: 10             # 全体相関の信頼度（z値）下限。下回れば中断
                            #   （共通の音が無い/対応素材が違う場合を弾く）
  verify: true              # 複数地点で「動画全域の整合」を検証（audio-sync-verify）
                            #   スコアが高くても「一部だけ一致」を見抜くための2段目
  verify_probes: 5          # 検証地点の数
  verify_window: 30         # 各検証地点の窓（秒）
  tolerance: 0.5            # 各地点で許容する残差（秒）。超えると不整合とみなす
  # 注: 手動オフセット指定（sync.offset）は現状未実装。自動検出のみ。

# ------------------------------------------------------------
# output（必須は path）— 最終成果物
# ------------------------------------------------------------
output:
  path: out/final.mp4       # 出力パス（必須）。拡張子は codec と整合させる
  codec: aac                # aac | pcm | alac | copy   ※映像は常に -c:v copy 無劣化
                            #   aac  -> mp4（配布・視聴向き。音声のみ再エンコード）
                            #   pcm  -> mov（24bit 無劣化・アーカイブ向き、ファイル大）
                            #   alac -> mov（可逆圧縮）
                            #   copy -> 入力音声コーデックをそのままコピー
  bitrate: 320k             # codec: aac のときのみ有効

# ------------------------------------------------------------
# work_dir（任意）— 中間生成物の置き場。既定 .work
# ------------------------------------------------------------
# 完了時に自動削除（--keep-work で保持）。外付けSSDが素材元のときは、ここを内蔵の
# ローカルディスクにすると中間 I/O を速い側へ逃がせる（絶対パス可）。
work_dir: .work
# work_dir: /Users/you/works/.rehearsal-sync-work/20260802
