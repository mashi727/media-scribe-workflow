# ============================================================
# take.yaml — rehearsal-sync 用の per-take 設定
# ============================================================
# 一次ファイル（カメラ映像 + 別録り L/R 音声）から、同期・差し替え
# 済み映像を 1 コマンドで生成するための宣言的設定。
#
#   rehearsal-sync take.yaml
#   rehearsal-sync take.yaml --dry-run     # 計画だけ表示
#
# パスはすべて「この YAML があるフォルダ」基準の相対（glob 可）。
# テイクフォルダをどこに置いても、どこから実行しても動く。
# ============================================================

version: 1

# --- 入力（glob 可。分割セグメントは名前順に連結される） ---
# 想定フォルダ構成（take 直下）:
#   ./VID_*.mp4    Insta360 Ace Pro 2 の映像（take 直下・単一 or セグメント）
#   ./L/*.wav      RODE Wireless Pro TX1 の内部録音（分割）
#   ./R/*.wav      RODE Wireless Pro TX2 の内部録音（分割）
video:
  - "VID_*.mp4"            # take 直下に置く場合。video/ サブフォルダなら video/*.mp4

audio:
  left:  [ L/*.wav ]       # TX1 → ステレオ左（例: 指揮者マイク）
  right: [ R/*.wav ]       # TX2 → ステレオ右
  # 注意: L/R は独立レコーダー（開始時刻・クロックが別）。rehearsal-sync は各chを
  #       映像へ個別同期してから結合するので、この 2 系統をそのまま渡してよい。
  # 代わりに相互整合済みステレオを渡す場合:
  # stereo: [ mix/*.wav ]  # left/right の代わりに指定（1 本として同期・差し替え）

# --- 正規化（各チャンネル個別に適用） ---
normalize:
  method: loudnorm         # loudnorm | peak | none
  I:   -14                 # 目標 integrated loudness (LUFS)
  TP:  -1.5                # true peak ceiling (dBTP)
  LRA: 11                  # loudness range (LU)
  bit_depth: "24"          # 16 | 24 | 32f

# --- クロックドリフト補正（長時間テイク向け） ---
drift:
  enabled: true            # 3h 級は true 推奨。短尺は false でよい
  window: 120              # 冒頭/終端の測定窓（秒）

# --- 同期 ---
sync:
  offset: auto             # auto | <秒数>（手動固定するとき）
  rate: 8000               # 同期検出のサンプルレート

# --- 出力 ---
output:
  path: out/final.mp4
  codec: aac               # aac | pcm | alac | copy
  bitrate: 320k            # aac のとき有効

# --- 中間生成物の置き場（省略時 .work、完了時に自動削除） ---
work_dir: .work
